name: Upgrade DeployFlow platform

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Preview and approve exact scope before apply. Recovery only verifies recorded images.'
        type: choice
        options: [preview, apply, rollback-preview, rollback-apply, verify-preview, verify-apply, status]
        default: preview
      release_run_id:
        description: 'Successful Platform checks and images publication run ID (upgrade only)'
        type: string
      release_attempt:
        description: 'Exact publication run attempt (upgrade only)'
        type: string
        default: '1'
      receipt_id:
        description: 'Original server receipt SHA256 (rollback or verification recovery)'
        type: string
      approve_plan_sha256:
        description: 'Exact preview SHA256; leave blank for previews'
        type: string
      confirmation:
        description: 'UPGRADE <source SHA>, ROLLBACK <receipt ID> or VERIFY <receipt ID>'
        type: string

permissions:
  contents: read
  actions: read
concurrency:
  group: deployflow-platform-k3s
  cancel-in-progress: false

env:
  DF_CONTROLLER_WORKFLOW: .github/workflows/platform-upgrade.yml

jobs:
  upgrade:
    if: github.ref == 'refs/heads/main' && github.repository == 'DamiBeGud/deploy-flow'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: k3s
    outputs:
      needs_verification: ${{ steps.operation.outputs.needs_verification }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate exact publication provenance
        if: inputs.operation == 'preview' || inputs.operation == 'apply'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          RELEASE_ATTEMPT: ${{ inputs.release_attempt }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RELEASE_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID/attempts/$RELEASE_ATTEMPT" > "$RUNNER_TEMP/publication.json"
          python3 deploy/k3s/check_publication.py "$RUNNER_TEMP/publication.json" "$GITHUB_SHA" "$RELEASE_ATTEMPT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: inputs.operation == 'preview' || inputs.operation == 'apply'
        with:
          name: platform-release-${{ inputs.release_attempt }}
          path: platform-release
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Reject an old workflow rerun after main moves
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          python3 deploy/k3s/check_publication.py --main "$GITHUB_SHA" "$current"
      - name: Execute the exact reviewed operation
        id: operation
        env:
          OPERATION: ${{ inputs.operation }}
          RECEIPT_ID: ${{ inputs.receipt_id }}
          APPROVAL: ${{ inputs.approve_plan_sha256 }}
          CONFIRMATION: ${{ inputs.confirmation }}
          SSH_KEY: ${{ secrets.K3S_SSH_PRIVATE_KEY }}
          SSH_HOSTS: ${{ secrets.K3S_SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.K3S_SSH_HOST }}
          SSH_PORT: ${{ vars.K3S_SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.K3S_SSH_USER }}
        run: python3 deploy/k3s/workflow_upgrade.py cluster
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: platform-upgrade-${{ github.run_id }}-${{ github.run_attempt }}
          path: upgrade-review/
          retention-days: 30
          if-no-files-found: warn

  public-verification:
    needs: upgrade
    if: needs.upgrade.outputs.needs_verification == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify public HTTPS independently
        run: python3 deploy/k3s/public_checks.py

  finalize:
    needs: [upgrade, public-verification]
    if: needs.upgrade.outputs.needs_verification == 'true' && needs.public-verification.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: k3s
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Persist completion after authenticated proof and fresh cluster verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SSH_KEY: ${{ secrets.K3S_SSH_PRIVATE_KEY }}
          SSH_HOSTS: ${{ secrets.K3S_SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.K3S_SSH_HOST }}
          SSH_PORT: ${{ vars.K3S_SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.K3S_SSH_USER }}
        run: python3 deploy/k3s/workflow_upgrade.py finalize
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: platform-finalization-${{ github.run_id }}-${{ github.run_attempt }}
          path: upgrade-review/
          retention-days: 30
          if-no-files-found: warn
