name: deployflow

# Activated only by `docker compose watch` / `docker compose up --watch`.
# Python source edits restart the API and consumers; durable jobs survive restarts.
x-source-watch: &source-watch
  watch:
    - action: sync+restart
      path: ./app
      target: /srv/backend/app
      initial_sync: true
      ignore:
        - __pycache__/
        - "**/__pycache__/"
        - "**/*.pyc"
    - action: rebuild
      path: ./pyproject.toml
    - action: rebuild
      path: ./uv.lock
    - action: rebuild
      path: ./Dockerfile

x-backend: &backend
  build: .
  image: deployflow-backend:local
  environment: &environment
    DF_DATABASE_URL: postgresql+psycopg://deployflow:local-only@postgres:5432/deployflow
    DF_REDIS_URL: redis://redis:6379/0
    DF_ENVIRONMENT: ${DF_ENVIRONMENT:-local}
    DF_AUTH_MODE: ${DF_AUTH_MODE:-development}
    DF_DEV_ACTOR_ID: ${DF_DEV_ACTOR_ID:-local-developer}
    DF_DEV_ORGANIZATION_ID: ${DF_DEV_ORGANIZATION_ID:-local-organization}
    DF_DEV_ROLES: ${DF_DEV_ROLES:-["developer"]}
    DF_CORS_ORIGINS: ${DF_CORS_ORIGINS:-["http://localhost:5173","http://127.0.0.1:5173"]}
    DF_FAKE_STEP_SECONDS: ${DF_FAKE_STEP_SECONDS:-1}
    DF_ANALYSIS_MODE: ${DF_ANALYSIS_MODE:-deterministic}
    DF_GHCR_REGISTRY: ${GHCR_REGISTRY:-}
    DF_GHCR_IMAGE: ${GHCR_IMAGE:-}
    DF_KUBE_READER_MCP_URL: ${DF_KUBE_READER_MCP_URL:-}
    DF_KUBE_VALIDATOR_MCP_URL: ${DF_KUBE_VALIDATOR_MCP_URL:-}
    DF_NODE_BASE_IMAGE: ${DF_NODE_BASE_IMAGE:-node:20-bookworm-slim}
    DF_GITHUB_APP_ID: ${DF_GITHUB_APP_ID:-}
    DF_GITHUB_INSTALLATION_ID: ${DF_GITHUB_INSTALLATION_ID:-}
    DF_GITHUB_PRIVATE_KEY_PATH: ${DF_GITHUB_PRIVATE_KEY_PATH:-}
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: deployflow
      POSTGRES_PASSWORD: local-only
      POSTGRES_DB: deployflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deployflow -d deployflow"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrate:
    build: .
    image: deployflow-backend:local
    environment:
      DF_DATABASE_URL: postgresql+psycopg://deployflow:local-only@postgres:5432/deployflow
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    develop: *source-watch
    networks: [default, kube-reader, kube-validator]
    environment:
      <<: *environment
      DF_GITHUB_WEBHOOK_SECRET: ${DF_GITHUB_WEBHOOK_SECRET:-}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    <<: *backend
    develop: *source-watch
    command: ["dramatiq", "app.worker", "--processes", "1", "--threads", "4", "--queues", "analysis"]
    stop_grace_period: 40s
    # The configured host path is mounted at the same absolute path inside the
    # worker, so the PEM never enters the image or repository.
    volumes:
      - ${DF_GITHUB_PRIVATE_KEY_PATH:-/dev/null}:${DF_GITHUB_PRIVATE_KEY_PATH:-/dev/null}:ro
    environment:
      <<: *environment
      DF_DEEPSEEK_API_KEY: ${DF_DEEPSEEK_API_KEY:-}
      DF_DEEPSEEK_BASE_URL: ${DF_DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DF_DEEPSEEK_MODEL: ${DF_DEEPSEEK_MODEL:-deepseek-flash}
      DF_DEEPSEEK_REASONING_EFFORT: ${DF_DEEPSEEK_REASONING_EFFORT:-high}

  github-worker:
    <<: *backend
    develop: *source-watch
    command: ["dramatiq", "app.worker", "--processes", "1", "--threads", "2", "--queues", "github"]
    volumes:
      - ${DF_GITHUB_PRIVATE_KEY_PATH:-/dev/null}:${DF_GITHUB_PRIVATE_KEY_PATH:-/dev/null}:ro

  delivery-worker:
    <<: *backend
    profiles: ["phase7-delivery"]
    develop: *source-watch
    networks: [default, kube-validator]
    command: ["dramatiq", "app.worker", "--processes", "1", "--threads", "2", "--queues", "delivery"]
    volumes:
      - ${DF_GITHUB_PRIVATE_KEY_PATH:-/dev/null}:${DF_GITHUB_PRIVATE_KEY_PATH:-/dev/null}:ro

  webhook:
    <<: *backend
    develop: *source-watch
    command: ["uvicorn", "app.webhook_main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *environment
      DF_GITHUB_WEBHOOK_SECRET: ${DF_GITHUB_WEBHOOK_SECRET:-}
    ports:
      - "127.0.0.1:${WEBHOOK_PORT:-8002}:8000"

  dispatcher:
    <<: *backend
    develop: *source-watch
    command: ["python", "-m", "app.dispatcher"]

  kube-reader-tunnel:
    profiles: ["phase5"]
    build:
      context: .
      dockerfile: ops/k3s/Dockerfile.tunnel
    environment:
      DF_K3S_SSH_TARGET: ${DF_K3S_SSH_TARGET:-}
    volumes:
      - ${DF_K3S_SSH_KEY_PATH:-/dev/null}:/run/deployflow/ssh_key:ro
      - ${DF_K3S_KNOWN_HOSTS_PATH:-/dev/null}:/run/deployflow/known_hosts:ro
    tmpfs: [/run/deployflow-runtime:mode=0700]
    networks: [kube-reader]
    restart: unless-stopped

  kube-validator-tunnel:
    profiles: ["phase5"]
    build:
      context: .
      dockerfile: ops/k3s/Dockerfile.tunnel
    environment:
      DF_K3S_SSH_TARGET: ${DF_K3S_SSH_TARGET:-}
    volumes:
      - ${DF_K3S_SSH_KEY_PATH:-/dev/null}:/run/deployflow/ssh_key:ro
      - ${DF_K3S_KNOWN_HOSTS_PATH:-/dev/null}:/run/deployflow/known_hosts:ro
    tmpfs: [/run/deployflow-runtime:mode=0700]
    networks: [kube-validator]
    restart: unless-stopped

  kube-reader:
    <<: *backend
    profiles: ["phase5"]
    network_mode: service:kube-reader-tunnel
    user: "0:0"
    depends_on:
      kube-reader-tunnel:
        condition: service_started
    environment:
      DF_KUBE_MCP_ROLE: reader
      DF_KUBE_API_SERVER: https://127.0.0.1:16443
      DF_KUBE_CA_PATH: /run/deployflow/ca.crt
      DF_KUBE_TOKEN_PATH: /run/deployflow/token
    volumes:
      - ${DF_KUBE_CA_PATH:-/dev/null}:/run/deployflow/ca.crt:ro
      - ${DF_KUBE_READER_TOKEN_PATH:-/dev/null}:/run/deployflow/token:ro
    tmpfs: [/run/deployflow-runtime:mode=0700]
    command: ["python", "-m", "mcp_servers.credential_bootstrap"]
    restart: unless-stopped

  kube-validator:
    <<: *backend
    profiles: ["phase5"]
    network_mode: service:kube-validator-tunnel
    user: "0:0"
    depends_on:
      kube-validator-tunnel:
        condition: service_started
    environment:
      DF_KUBE_MCP_ROLE: validator
      DF_KUBE_API_SERVER: https://127.0.0.1:16443
      DF_KUBE_CA_PATH: /run/deployflow/ca.crt
      DF_KUBE_TOKEN_PATH: /run/deployflow/token
    volumes:
      - ${DF_KUBE_CA_PATH:-/dev/null}:/run/deployflow/ca.crt:ro
      - ${DF_KUBE_VALIDATOR_TOKEN_PATH:-/dev/null}:/run/deployflow/token:ro
    tmpfs: [/run/deployflow-runtime:mode=0700]
    command: ["python", "-m", "mcp_servers.credential_bootstrap"]
    restart: unless-stopped

  tests:
    <<: *backend
    profiles: ["test"]
    environment:
      <<: *environment
      DF_DATABASE_URL: postgresql+psycopg://deployflow:local-only@postgres:5432/deployflow_test
      DF_FAKE_STEP_SECONDS: "0"
      DF_ANALYSIS_PROVIDER: "fake"
      DF_ANALYSIS_MODE: "fake"
    command: ["pytest", "-q"]
    restart: "no"

volumes:
  postgres-data:
  redis-data:

networks:
  kube-reader:
  kube-validator:
