[project]
name = "deployflow-backend"
version = "0.1.0"
description = "DeployFlow API and durable analysis jobs"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "dramatiq[redis]>=1.18,<3",
  "httpx>=0.28,<1",
  "PyJWT[crypto]>=2.10,<3",
  "mcp>=2,<3",
  "tree-sitter>=0.25,<0.26",
  "tree-sitter-javascript>=0.23,<0.24",
  "PyYAML>=6.0,<7",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
cache_dir = "/tmp/deployflow-pytest-cache"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
