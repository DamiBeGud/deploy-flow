id: python
version: 1.0.0
description: Inspect source-grounded python web application requirements without execution.
triggers:
  any_files:
  - pyproject.toml
  - requirements.txt
  any_languages:
  - python
allowed_tools:
- repo.read_file
- repo.search_text
- repo.read_manifest
risk_tier: read_only
input_schema: analysis-facts-v1
output_schema: infrastructure-assessment-v2
max_context_chars: 12000
